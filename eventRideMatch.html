 items.forEach(i=>{if(days&&!days.includes(new Date(i.s).getDay()))return;let sc=days?1:0;(i.tags||[]).forEach(t=>{if(tags.has(t))sc+=2});const hay=(i.t+" "+(i.at||i.venue||"")+" "+(i.desc||"")).toLowerCase();words.forEach(w=>{if(hay.includes(w))sc++});if(sc>0)out.push([i.id,sc,i.s])});

  clearTimeout(tm);if(!r.ok)throw 0;const j=await r.json(),ok=new Set(items.map(i=>i.id));if(!Array.isArray(j.ids))throw 0;
  return{ids:j.ids.filter(i=>ok.has(i)),chips:j.understood||[],src:"AI"}}catch(e){}}
 return{...local(q,items),src:"local"}}

function openTh(k){st.tab="groups";st.th=k;st.ev=null;render();window.scrollTo(0,0)}
function threadView(){const T=threads().find(t=>t.k===st.th);if(!T){st.th=null;return msgsTab()}const arch=T.end<now();
 return `<button class="back" onclick="st.th=null;render()">← Back to messages</button><h2 style="font-size:22px">${esc(T.t)}</h2><div class="mute">${T.m.map(nm).join(", ")}${arch?" · <b>Archived</b> (read-only)":""}</div>
 <div style="margin:14px 0">${msgsOf(T).map(m=>{const mine=m.f===st.me.id;return `<div class="bub ${mine?"me":""}"><small>${mine?"You":nm(m.f)}</small>${esc(m.x)}</div>`}).join("")}</div>
 ${arch?"":`<div class="ai"><input type="text" id="mi" aria-label="Message" placeholder="Write a message" onkeydown="if(event.key==='Enter')send()"><button class="btn btn-p" onclick="send()">Send</button></div>`}
 <p class="safe">Keep plans in the group and be kind. <a href="#" onclick="toast('Report sent to USG');return false">Report</a> · <a href="#" onclick="toast('User blocked');return false">Block</a></p>`}
function send(){const inp=$("mi"),x=inp.value.trim();if(!x)return;const k=st.th,T=threads().find(t=>t.k===k),who=T.m.find(i=>i!==st.me.id);msgsOf(T).push({f:st.me.id,x});render();window.scrollTo(0,document.body.scrollHeight);const n=$("mi");if(n)n.focus();
 if(who)setTimeout(()=>{if(msgs[k]){msgs[k].push({f:who,x:REPL[msgs[k].length%REPL.length]});if(st.th===k&&st.tab==="groups"){render();window.scrollTo(0,document.body.scrollHeight)}}},1500)}
function msgsTab(){if(st.th)return threadView();const T=threads();return `<h2>Messages</h2><p class="mute" style="margin:6px 0 14px">Group chats for your event groups and rides. Chats are archived 24 hours after the event.</p>`+(T.length?T.map(t=>{const M=msgsOf(t),l=M[M.length-1];return `<button class="card" style="width:100%;text-align:left" onclick="st.th='${t.k}';render()"><b>${esc(t.t)}</b>${t.end<now()?' <span class="chip">Archived</span>':""}<div class="mute">${esc(t.sub)} · ${t.m.length} people</div><div class="mute" style="margin-top:4px">${nm(l.f)}: ${esc(l.x.slice(0,60))}</div></button>`}).join(""):'<div class="card">No chats yet. Go to an event with someone or join a ride and a chat opens automatically.</div>')}

/* ---------- USG admin ---------- */
function admin(){const gc=Object.values(st.groups).filter(g=>g.length).length,seg=[["First-year",62],["Sophomore to senior",48],["Transfer",24],["Commuter",18]];
 const tg=(k,l)=>`<div class="row sp" style="margin-top:8px"><span>${l}</span><button class="sw ${st[k]?"on":""}" aria-label="Toggle ${l}" onclick="st.${k}=!st.${k};render()"></button></div>`;
 return `<h2>USG dashboard</h2><p class="mute" style="margin-top:6px">Pilot: 5 orgs, one semester. Sample data plus live demo activity.</p>
 <div class="stats"><div class="stat"><b>${vis({orgs:[1,2,3,4,5,6,7]}).length}</b>Upcoming events</div><div class="stat"><b>${14+P.length}</b>Active buddy posts</div><div class="stat"><b>${12+gc}</b>Groups formed</div><div class="stat"><b>${R.filter(r=>r.s>now()).length}</b>Open ride requests</div><div class="stat"><b>${st.cleaned}</b>Expired and cleaned</div></div>
 <div class="card"><b>Participation by student type</b><p class="mute" style="margin:2px 0 8px">Gold bars show underserved groups.</p>${seg.map(([n,v])=>`<div class="row sp"><span>${n}</span><span class="mute">${v}%</span></div><div class="bar"><i class="${v<30?"low":""}" style="width:${v}%"></i></div>`).join("")}</div>
 <div class="card"><b>Reported content</b>${st.reports.length?st.reports.map(r=>`<div class="row sp" style="margin-top:8px"><span>${esc(r.txt)}</span><span class="row"><button class="btn btn-s sm" onclick="rep(${r.id},'Approved')">Approve</button><button class="btn btn-p sm" onclick="rep(${r.id},'Removed')">Remove</button></span></div>`).join(""):'<div class="mute" style="margin-top:6px">No open reports.</div>'}</div>
 <div class="card"><b>Settings</b>${tg("carpool","Ride sharing")}${tg("aiOn","AI search")}<div class="mute" style="margin-top:8px">Featured orgs: Welcome Committee, Film Society · Moderation keywords: spam, harassment</div></div>
 <div class="card"><button class="btn btn-p" onclick="pilot()">Generate pilot report</button>${st.pilot?`<p style="margin:10px 0 0">${st.pilot}</p>`:""}</div>`}
function rep(id,a){st.reports=st.reports.filter(r=>r.id!==id);toast(a);render()}
function pilot(){st.pilot="This week "+P.length+" buddy posts were active, "+st.cleaned+" expired and were cleaned up, and groups formed across the pilot orgs. Transfer (24%) and commuter (18%) participation lags first-years (62%). Recommendation: promote evening mixers to transfers, feature the Welcome Committee events, and keep ride sharing on with a safety reminder.";render()}

document.addEventListener("keydown",e=>{if(e.key==="Escape"&&st.menu){st.menu=false;render()}});
function render(){const a=$("app");if(!st.me&&!st.admin){a.innerHTML=login();return}sweep();
 let b;if(st.admin)b=admin();else if(st.tab==="feed")b=st.ev?eventView():feed();else if(st.tab==="rides")b=ridesTab();else b=msgsTab();
 a.innerHTML=header()+`<div class="wrap">${!st.admin?pills():""}${b}</div>`+(st.menu?menu():"")}
render();
</script>
</body>
</html>
